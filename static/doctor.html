<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hekimyol — Hekim Konsolu</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <h1>hekimyol — Hekim Konsolu</h1>
  <p class="sub">Hastanın verdiği rapor kodu ile ön konsültasyon raporunu görüntüleyin.
    Her görüntüleme KVKK gereği kayıt altına alınır.</p>
  <div class="card">
    <input type="password" id="key" placeholder="Hekim anahtarı" autocomplete="off">
    <input type="text" id="rid" placeholder="Rapor kodu (UUID)" style="margin-top:10px">
    <div style="margin-top:12px"><button id="go">Raporu getir</button></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card" id="out" hidden>
    <p class="sub" id="meta"></p>
    <pre id="md"></pre>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
$("#go").addEventListener("click", async () => {
  $("#err").textContent = "";
  try {
    const r = await fetch("/api/report/" + encodeURIComponent($("#rid").value.trim()),
      {headers: {"x-doctor-key": $("#key").value}});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    $("#out").hidden = false;
    $("#meta").textContent = `Oturum ${d.session_id} · oluşturulma ${d.created_at}`;
    $("#md").textContent = d.markdown;
  } catch (e) { $("#err").textContent = e.message; }
});
</script>
</body>
</html>
